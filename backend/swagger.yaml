openapi: 3.0.0
info:
  title: Wati Health API
  description: Wati Health Recipe and Medical AI Platform Backend API
  version: 1.0.0
servers:
  - url: http://localhost:5001/api
    description: Local server
  - url: https://api.wati.health/api
    description: Production server
paths:
  /status:
    get:
      tags:
        - Status
      summary: API Healthcheck
      responses:
        '200':
          description: Server status
          content:
            application/json:
              example:
                status: ok
                message: Backend is running!
                version: 1.0.0
  /medical/catalog:
    get:
      tags:
        - Medical
      summary: Get intolerance catalog
      responses:
        '200':
          description: Returns medical intolerances
  /medical/triggers:
    get:
      tags:
        - Medical
      summary: Get medical triggers
      responses:
        '200':
          description: Returns medical triggers
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
                - acceptedTerms
              properties:
                email:
                  type: string
                password:
                  type: string
                displayName:
                  type: string
                acceptedTerms:
                  type: boolean
                language:
                  type: string
      responses:
        '201':
          description: User created
        '400':
          description: Validation error
        '409':
          description: Email already in use
  /auth/login:
    post:
      tags:
        - Auth
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Logged in successfully
        '401':
          description: Invalid credentials
  /auth/resend-verification:
    post:
      tags:
        - Auth
      summary: Resend verification email
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verification email sent
  /auth/verify:
    post:
      tags:
        - Auth
      summary: Verify account using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Account verified successfully
        '400':
          description: Invalid token
  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Reset email sent (if user exists)
  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Password updated
        '400':
          description: Invalid token or password
  /auth/logout:
    post:
      tags:
        - Auth
      summary: User logout
      responses:
        '200':
          description: Logged out
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      tags:
        - Auth
      summary: Update user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profile updated
    delete:
      tags:
        - Auth
      summary: Delete user account (GDPR)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted
  /recipes:
    get:
      tags:
        - Recipes
      summary: Search and list recipes
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: query
          schema:
            type: string
          description: Search term for recipes
        - in: query
          name: organization_id
          schema:
            type: string
          description: Filter by organization ID (optional)
        - in: query
          name: page
          schema:
            type: integer
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
          description: Items per page
      responses:
        '200':
          description: List of recipes
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipe'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      pages:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
  /recipes/tags:
    get:
      tags:
        - Recipes
      summary: Get all unique tags
      responses:
        '200':
          description: List of tags
  /recipes/tags/refresh:
    post:
      tags:
        - Recipes
      summary: Clear tag and recipe caches
      security:
        - adminApiKey: []
      responses:
        '200':
          description: Caches cleared
  /favorites:
    get:
      tags:
        - Favorites
      summary: Get user favorite recipes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of favorite recipes
    post:
      tags:
        - Favorites
      summary: Toggle favorite status
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recipeId
                - title
              properties:
                recipeId:
                  type: string
                title:
                  type: string
                image:
                  type: string
      responses:
        '201':
          description: Favorited
        '200':
          description: Unfavorited
  /favorites/{recipeId}:
    delete:
      tags:
        - Favorites
      summary: Remove recipe from favorites
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: recipeId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Removed from favorites
  /suggestions:
    post:
      tags:
        - Suggestions
      summary: Suggest a new recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - term
              properties:
                term:
                  type: string
                userId:
                  type: string
      responses:
        '201':
          description: Suggestion recorded
  /admin/stats:
    get:
      tags:
        - Admin
      summary: Get platform usage statistics
      security:
        - adminApiKey: []
        - bearerAuth: []
      responses:
        '200':
          description: Usage statistics (top searches, conversion, uptime)
  /admin/organizations:
    get:
      tags:
        - Admin
      summary: List all organizations
      security:
        - adminApiKey: []
        - bearerAuth: []
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
    post:
      tags:
        - Admin
      summary: Create a new organization
      security:
        - adminApiKey: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - slug
              properties:
                name:
                  type: string
                slug:
                  type: string
      responses:
        '201':
          description: Organization created
        '409':
          description: Organization already exists
  /admin/organizations/{id}:
    get:
      tags:
        - Admin
      summary: Get organization details and collaborators list
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detailed organization data with associated users
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  slug:
                    type: string
                  is_active:
                    type: boolean
                  settings:
                    type: object
                  status:
                    type: string
                    enum: [active, suspended]
                  userCount:
                    type: integer
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        email:
                          type: string
                        displayName:
                          type: string
                        isActive:
                          type: boolean
                        role:
                          type: string
                          enum: [admin, user]
                        joinedAt:
                          type: string
                          format: date-time
        '404':
          description: Organization not found
    put:
      tags:
        - Admin
      summary: Update organization
      security:
        - adminApiKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - slug
              properties:
                name:
                  type: string
                slug:
                  type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: Organization updated
        '404':
          description: Not found
    delete:
      tags:
        - Admin
      summary: Toggle organization status (active/suspended)
      security:
        - adminApiKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  organization:
                    $ref: '#/components/schemas/Organization'
  /admin/organizations/{id}/users:
    post:
      tags:
        - Admin
      summary: Add a single collaborator user to organization
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - displayName
                - role
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                role:
                  type: string
                  enum: [admin, user]
      responses:
        '201':
          description: Collaborator user added/associated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  displayName:
                    type: string
                  isActive:
                    type: boolean
                  role:
                    type: string
                    enum: [admin, user]
                  joinedAt:
                    type: string
                    format: date-time
                  createdNewUser:
                    type: boolean
        '400':
          description: Validation error
        '404':
          description: Organization not found
        '409':
          description: User already belongs to organization
  /admin/organizations/{id}/users/bulk:
    post:
      tags:
        - Admin
      summary: Bulk upload and associate collaborator users
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - users
              properties:
                users:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required:
                      - email
                      - displayName
                      - role
                    properties:
                      email:
                        type: string
                        format: email
                      displayName:
                        type: string
                      role:
                        type: string
                        enum: [admin, user]
      responses:
        '200':
          description: Bulk import processed with detailed summary of succeeded and failed records
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  created:
                    type: integer
                  associated:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row:
                          type: integer
                        email:
                          type: string
                        reason:
                          type: string
        '400':
          description: Validation error or limit exceeded
        '404':
          description: Organization not found
  /admin/organizations/{id}/users/{userId}:
    delete:
      tags:
        - Admin
      summary: Disassociate a user from organization
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User disassociated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Organization or user relationship not found
  /admin/recipes:
    get:
      tags:
        - Admin
      summary: List global recipes
      security:
        - adminApiKey: []
        - bearerAuth: []
      responses:
        '200':
          description: List of recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'
    post:
      tags:
        - Admin
      summary: Create a new global recipe
      security:
        - adminApiKey: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeUpdate'
      responses:
        '201':
          description: Recipe created
  /admin/recipes/{id}:
    put:
      tags:
        - Admin
      summary: Update global recipe
      security:
        - adminApiKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeUpdate'
      responses:
        '200':
          description: Recipe updated
    delete:
      tags:
        - Admin
      summary: Delete global recipe
      security:
        - adminApiKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recipe deleted
  /admin/tags:
    get:
      tags:
        - Admin
      summary: List global tags
      security:
        - adminApiKey: []
        - bearerAuth: []
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
    post:
      tags:
        - Admin
      summary: Create a new global tag
      security:
        - adminApiKey: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - es
                - en
              properties:
                key:
                  type: string
                es:
                  type: string
                en:
                  type: string
      responses:
        '201':
          description: Tag created
  /admin/tags/{id}:
    put:
      tags:
        - Admin
      summary: Update global tag
      security:
        - adminApiKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - es
                - en
              properties:
                key:
                  type: string
                es:
                  type: string
                en:
                  type: string
      responses:
        '200':
          description: Tag updated
    delete:
      tags:
        - Admin
      summary: Delete global tag
      security:
        - adminApiKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tag deleted
  /ingest/image:
    post:
      tags:
        - Ingest
      summary: Ingest recipe from a single image URL
      security:
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - imageUrl
              properties:
                imageUrl:
                  type: string
                generateImage:
                  type: boolean
                saveToDb:
                  type: boolean
      responses:
        '200':
          description: Recipe processed
  /ingest/images:
    post:
      tags:
        - Ingest
      summary: Ingest recipe from two image URLs
      security:
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - imageUrl1
                - imageUrl2
              properties:
                imageUrl1:
                  type: string
                imageUrl2:
                  type: string
                generateImage:
                  type: boolean
                saveToDb:
                  type: boolean
      responses:
        '200':
          description: Recipe processed
  /ingest/text:
    post:
      tags:
        - Ingest
      summary: Ingest recipe from text
      security:
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                generateImage:
                  type: boolean
                saveToDb:
                  type: boolean
                sourceType:
                  type: string
                sourceReference:
                  type: string
      responses:
        '200':
          description: Recipe processed
  /ingest/transcribe:
    post:
      tags:
        - Ingest
      summary: Transcribe audio to text
      security:
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - audioUrl
              properties:
                audioUrl:
                  type: string
                language:
                  type: string
      responses:
        '200':
          description: Transcription
  /ingest/voice:
    post:
      tags:
        - Ingest
      summary: Ingest recipe from voice note
      security:
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - audioUrl
              properties:
                audioUrl:
                  type: string
                language:
                  type: string
                saveToDb:
                  type: boolean
      responses:
        '200':
          description: Recipe processed
  /ingest/{slug}/{action}:
    post:
      tags:
        - Ingest
      summary: Action on ingested recipe (publish, post, csv, curl, refresh-image)
      security:
        - adminApiKey: []
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: path
          name: action
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Action performed
  /ingest/save:
    post:
      tags:
        - Ingest
      summary: Save or update recipe
      security:
        - adminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title_es
                - title_en
              properties:
                title_es:
                  type: string
                title_en:
                  type: string
      responses:
        '200':
          description: Recipe updated
        '201':
          description: Recipe created
  /ingest/logs:
    get:
      tags:
        - Ingest
      summary: Get ingestion logs
      security:
        - adminApiKey: []
      responses:
        '200':
          description: Ingestion logs

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminApiKey:
      type: apiKey
      in: header
      name: X-Admin-Key
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [user, admin, super_admin]
        organizations:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Organization'
        isVerified:
          type: boolean
    Recipe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title_es:
          type: string
        title_en:
          type: string
        slug:
          type: string
        organization_id:
          type: string
          format: uuid
          nullable: true
        image_url:
          type: string
        tags:
          type: array
          items:
            type: string
        nutrition:
          type: object
    RecipeUpdate:
      type: object
      properties:
        title_es:
          type: string
        title_en:
          type: string
        slug:
          type: string
        prep_time_minutes:
          type: integer
        cook_time_minutes:
          type: integer
        servings:
          type: integer
        difficulty:
          type: string
          enum: [easy, medium, hard]
        status:
          type: string
          enum: [draft, published, archived]
        sibo_risk_level:
          type: string
          enum: [safe, caution, avoid]
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        is_active:
          type: boolean
        settings:
          type: object
        userCount:
          type: integer
        status:
          type: string
          enum: [active, suspended, pending]
    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        es:
          type: string
        en:
          type: string
        category:
          type: string

